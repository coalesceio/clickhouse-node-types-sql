fileVersion: 2
id: SQLFact
isDisabled: false
metadata:
  defaultStorageLocation: null
  error: null
  nodeMetadataSpec: |-
    capitalized: Fact
    short: FCT
    plural: Facts
    tagColor: '#D9A438'
    description: |-
      • Every column needs a unique @id("<6 hex digits>"). With a business key (@isBusinessKey), @isSystemCreateDate and @isSystemUpdateDate are required.
      • Column @id overrides the general coa SQL-format rule ("never write @id on a column", coa describe sql-format): this node type matches columns across redeploys by @id, so every column must carry its own — the "Missing Column IDs" check stops the node otherwise.
        Ex. `n_Nationkey` AS `n_Nationkey` @id("a1b2c3") @isBusinessKey
      • Engine: the node's @engine, else the package parameter "engine", else MergeTree. A plain-insert Fact is never a ReplacingMergeTree; an allColumnMatch Fact on a ReplacingMergeTree is ordered by its match columns.
      • ReplacingMergeTree: ORDER BY is built from the business key — do not add @orderBy / @primaryKey. Query it with FINAL.
      • ReplacingMergeTree (package engine parameter or @engine("ReplacingMergeTree")): add @notNull to the @isSystemUpdateDate column. Without it the column is Nullable, a "Warning: @isSystemUpdateDate without @notNull" stage is shown, and ClickHouse rejects the table (a Nullable version argument).
      • Agentic creation: when the user asks for a ReplacingMergeTree, or the package engine parameter is set to ReplacingMergeTree, write the @isSystemUpdateDate column with @notNull (see isSystemUpdateDate).
        Ex. CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS "SYSTEM_UPDATE_DATE" @isSystemUpdateDate @notNull

    deployStrategy: advanced
    enableCTESupport: true

    annotations:
        node:

        - name: materializationType
          description: |-
            • Controls node's materialization type — supports 𝘁𝗮𝗯𝗹𝗲 and 𝘃𝗶𝗲𝘄.
          isRequired: false
          parameters:
            - name: type
              type: string
              isRequired: true
              default: table
              example: view
              options:
                - table
                - view

        - name: partitionBy
          description: |-
            • The table's PARTITION BY key. Each argument is one term — a column or an expression, written as it should appear in the SQL; several terms are partitioned together.
              Ex. partitionBy("toYYYYMM(`order_Date`)")
              Ex. partitionBy("toYYYYMM(`order_Date`)", "`region`")
            • Keep it coarse (e.g. one partition per month): each partition is stored separately, and too many partitions slow inserts down and eventually make them fail.
            • Without partitionBy the table is not partitioned. Ignored on views.
            • ⚠️ Changing partitionBy (or renaming / retyping a column used in it) on redeploy recreates the table — existing data is lost.
          isRequired: false
          parameters:
            - name: term
              type: string
              isRequired: true
              example: toYYYYMM(<col_name>)

        - name: orderBy
          description: |-
            • The table's ORDER BY (sort) key. Each argument is one term — a column or an expression, written as it should appear in the SQL.
              Ex. orderBy("`n_Nationkey`")
              Ex. orderBy("`n_Nationkey`", "`n_Name`", "toYYYYMM(`last_Modified`)")
            • 𝗠𝗲𝗿𝗴𝗲𝗧𝗿𝗲𝗲 only (engine("MergeTree") or a plain-insert Fact). ⛔ Not accepted on a ReplacingMergeTree — its ORDER BY is built from the business key (allColumnMatch: its match columns), and the deploy and the run stop if orderBy is set.
            • Without orderBy (and primaryKey) a MergeTree table uses ORDER BY tuple(). Ignored on views.
            • ⚠️ On redeploy, removing trailing terms or adding new columns (without a default) is altered in place when primaryKey is set; any other orderBy change (or renaming / retyping a column used in it) recreates the table — existing data is lost.
          isRequired: false
          parameters:
            - name: term
              type: string
              isRequired: true
              example: toYYYYMM(<col_name>)

        - name: primaryKey
          description: |-
            • The table's PRIMARY KEY. Each argument is one term, as in orderBy.
            • ClickHouse requires the primary key to be the leading terms of ORDER BY, in the same order — the create fails otherwise.
              Ex. orderBy("`n_Nationkey`", "`n_Name`", "toYYYYMM(`last_Modified`)") primaryKey("`n_Nationkey`", "`n_Name`")
            • 𝗠𝗲𝗿𝗴𝗲𝗧𝗿𝗲𝗲 only, as orderBy. ⛔ Not accepted on a ReplacingMergeTree.
            • Without orderBy, the primary key is also the sort key: primaryKey("`n_Nationkey`") → ORDER BY (`n_Nationkey`).
            • When it is the same as orderBy, it is not written separately. Ignored on views.
            • ⚠️ Changing primaryKey (or renaming / retyping a column used in it) on redeploy recreates the table — existing data is lost.
          isRequired: false
          parameters:
            - name: term
              type: string
              isRequired: true
              example: <col_name>

        - name: settings
          description: |-
            • The table's MergeTree SETTINGS. Each argument is one setting, written as name = value.
              Ex. settings("index_granularity = 8192")
              Ex. settings("index_granularity = 8192", "min_bytes_for_wide_part = 0")
            • allow_nullable_key = 1 is added automatically when the table has an orderBy, primaryKey or partitionBy, so nullable columns can be key terms — set it here to override it.
            • Ignored on views.
            • On redeploy, changes are applied in place with MODIFY SETTING / RESET SETTING.
          isRequired: false
          parameters:
            - name: setting
              type: string
              isRequired: true
              example: index_granularity = 8192

        - name: engine
          description: |-
            • The table's ENGINE: MergeTree or ReplacingMergeTree only, written without arguments. The name is not case-sensitive (replacingmergetree works), and MergeTree() is the same as MergeTree. Any other engine (SummingMergeTree, Log, ...) or arguments stop the deploy and the run (Invalid configuration: engine).
            • If not specified, the package's engine parameter is used; if that is empty too, defaults to 𝗠𝗲𝗿𝗴𝗲𝗧𝗿𝗲𝗲 (no ENGINE is written, as in ClickHouse). Set the package parameter to ReplacingMergeTree to make it the default for every Dimension and Fact — except a plain-insert Fact, which stays MergeTree, since a ReplacingMergeTree would collapse its identical rows. An allColumnMatch Fact takes it, ordered by its match columns.
            • 𝗥𝗲𝗽𝗹𝗮𝗰𝗶𝗻𝗴𝗠𝗲𝗿𝗴𝗲𝗧𝗿𝗲𝗲 — the load only inserts. A changed row is re-inserted with a newer SYSTEM_UPDATE_DATE, and ClickHouse keeps the latest row per ORDER BY key at a background merge (nothing is deleted).
              • The @isSystemUpdateDate column is the version argument: ReplacingMergeTree → ReplacingMergeTree(`SYSTEM_UPDATE_DATE`). Required, and must be marked @notNull.
              • Like every column it is Nullable without @notNull, and ClickHouse rejects a Nullable version argument: a "Warning: @isSystemUpdateDate without @notNull" stage is shown, the flow continues, and the create (or the redeploy's ALTER) fails with ClickHouse's error.
                Ex. CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS "SYSTEM_UPDATE_DATE" @isSystemUpdateDate @notNull
              • ORDER BY is always built from the business key (required) — orderBy / primaryKey are not accepted (a manual key could collapse different rows or keep replaced copies).
              • Until a merge, a plain SELECT can return the replaced copies as well — query with FINAL (SELECT ... FROM <table> FINAL, or SETTINGS final = 1). With the readWithFinal runtime parameter true, the load and the column tests end with SETTINGS final = 1; with it false they read the table as stored, so set final = 1 on the ClickHouse user. A "Note: Query with FINAL" deploy stage reminds whoever deploys.
            • 𝗠𝗲𝗿𝗴𝗲𝗧𝗿𝗲𝗲 — the load inserts and then DELETEs the replaced copies (Clean Up Previous Data). orderBy / primaryKey can be set.
            • Write ReplacingMergeTree without arguments: the load sets the version argument and ORDER BY itself.
            • Ignored on views.
            • ⚠️ Changing engine on redeploy recreates the table — existing data is lost.
          isRequired: false
          parameters:
            - name: engine
              type: string
              isRequired: true
              default: ReplacingMergeTree
              example: MergeTree
              options:
                - ReplacingMergeTree
                - MergeTree

        - name: final
          description: |-
            • 𝗩𝗶𝗲𝘄𝘀 𝗼𝗻𝗹𝘆 — the view reads its sources with FINAL (SETTINGS final = 1 at the end of its SELECT), so an upstream ReplacingMergeTree shows one row per key, without the copies its load replaced.
              Ex. @materializationType("view") @final
            • A view is fixed when it is deployed. It uses, in order:
              1. @final → SETTINGS final = 1
              2. no @final, readWithFinal runtime parameter true → SETTINGS final = 1
              3. no @final, readWithFinal false or not set → no SETTINGS
            • When the view's SQL already ends with its own SETTINGS clause, final = 1 is appended to it (SETTINGS max_threads = 4, final = 1). If that clause already sets final, its own value wins (SETTINGS final = 0, final = 1 reads without FINAL).
            • Adding or removing @final on redeploy recreates the view. Changing readWithFinal later does not change a deployed view.
            • On a table it does nothing: a non-failing "Warning: @final on a table" stage is shown, and the load follows readWithFinal.
          isRequired: false

        - name: optimize
          description: |-
            • Tables only — adds an "Optimize Table" stage after the load, before Post-SQL, that runs OPTIMIZE TABLE <table> FINAL, so ClickHouse merges the table's parts on every load instead of waiting for a background merge. Post-SQL and the After tests see the merged table.
              Ex. @optimize
            • On a ReplacingMergeTree the table then keeps only the latest row per ORDER BY key, so a plain SELECT matches a SELECT with FINAL — except a row whose @partitionBy value changed: merges never cross partitions, so its old copy stays (FINAL still hides it).
            • Rewrites the whole table on every run — use it on small or medium tables, or when reads must not need FINAL.
            • On a view it does nothing: a non-failing "Warning: @optimize on a view" stage is shown.
          isRequired: false

        - name: writeMode
          description: |-
            • Controls how data is written to the target table.
            • 𝘁𝗿𝘂𝗻𝗰𝗮𝘁𝗲𝗜𝗻𝘀𝗲𝗿𝘁 clears the table before loading, replacing its contents entirely;
            • 𝗮𝗽𝗽𝗲𝗻𝗱 inserts the new rows alongside whatever is already there.
            • If not specified in the SQL, defaults to 𝗮𝗽𝗽𝗲𝗻𝗱.
            • Ignored on views.
          isRequired: false
          parameters:
            - name: mode
              type: string
              description: Whether to 𝗧𝗥𝗨𝗡𝗖𝗔𝗧𝗘 the target table before inserting, or 𝗔𝗣𝗣𝗘𝗡𝗗 to it.
              isRequired: true
              default: append
              example: truncateInsert
              options:
                - truncateInsert
                - append

        - name: mergeStrategy
          description: |-
            • Picks the change-detection method; different methods require different column annotations.
            • If not specified: a node with an isBusinessKey column defaults to changeTracking - 𝗦𝗖𝗗 𝗧𝘆𝗽𝗲 𝟭; a node with no isBusinessKey column is loaded as a plain insert.
            • The value is not case-sensitive; any other value fails the run.
            • The SELECT/CTE should return one row per business key. A key returned more than once is loaded once (lastModified: the newest row; changeTracking: which one is not defined); a NULL business key is one key value, matched like any other. A pre-load test can stop the run instead.
            • allColumnMatch uses no business key.
            • MergeTree and ReplacingMergeTree give the same result: a MergeTree holds what a ReplacingMergeTree returns with FINAL (with readWithFinal true).
            • Always takes priority when set: changeTracking and lastModified merge on the business key, so the run fails if no column is marked isBusinessKey. allColumnMatch needs no isBusinessKey.
            • Ignored on views

            ◆ 𝗰𝗵𝗮𝗻𝗴𝗲𝗧𝗿𝗮𝗰𝗸𝗶𝗻𝗴
              • Compares every plain attribute column to detect a change — 𝗦𝗖𝗗 𝗧𝘆𝗽𝗲 𝟭.
              • Requires no lastModifiedTracking column

            ◆ 𝗹𝗮𝘀𝘁𝗠𝗼𝗱𝗶𝗳𝗶𝗲𝗱
              • Compares a single lastModifiedTracking timestamp column against the target's stored value — 𝗦𝗖𝗗 𝗧𝘆𝗽𝗲 𝟭.
              • Requires exactly one column marked lastModifiedTracking — the run fails if none is present.

            ◆ 𝗮𝗹𝗹𝗖𝗼𝗹𝘂𝗺𝗻𝗠𝗮𝘁𝗰𝗵
              • Meant for factless fact tables used for event tracking and coverage/relationship tracking.
              • Only inserts: a source row is inserted only if no target row matches it on the match columns; an existing row is never updated or deleted.
              • Match columns: the non-system columns that come from the source (Coalesce column lineage). A column that is only a transform — a constant, now(), generateUUIDv4(), a load id — is left out, so it never makes a stored row look new. With no lineage to go on (the node has its own CTEs, or reads a table function) every non-system column is matched.
              • isBusinessKey is not needed and is ignored if present (a warning is shown).
              • System columns are optional and never matched; any that are present are written exactly as the SELECT/CTE computes them.
              • NULL matches NULL: a row with a NULL in a column is not inserted again.
              • ReplacingMergeTree (@engine or the package engine parameter): ORDER BY is the match columns, so identical rows also collapse at a merge. The version argument is the @isSystemUpdateDate column when there is one; without it the engine is a bare ReplacingMergeTree, which keeps the last copy inserted. No business key or update date is required; @orderBy / @primaryKey and an engine with its own arguments are rejected.
              • Each load keeps one source row per match-column combination (the latest @isSystemUpdateDate when there is one) and skips the ones already stored.
              • Requires no lastModifiedTracking column

            Agentic creation — before writing a new Fact node's SELECT, ask the user (don't silently default):
            1. Which merge strategy do they want — changeTracking, lastModified, or allColumnMatch? If they don't know, explain the three options above and let them choose — don't pick changeTracking just because it's the fallback default.
            2. If they want a plain insert with no merge, leave out both this annotation and isBusinessKey — setting a strategy without a business key fails the run.

          isRequired: false
          parameters:
            - name: strategy
              type: string
              description: Which change-detection method to use.
              isRequired: true
              default: changeTracking
              options:
                - changeTracking
                - lastModified
                - allColumnMatch

        - name: disableTests
          description: |-
            • Controls whether configured tests are skipped.
            • Useful while developing a node — skip node-level and column-level tests without deleting them, so you can iterate on the SQL first and turn tests back on once the logic is settled.
          isRequired: false

        - name: tests
          description: |-
            • 🚦Node-level data quality test.
            • Runs the given 𝗾𝘂𝗲𝗿𝘆𝗦𝗤𝗟 against the target and fails the test if it returns any records — write the query so it selects only the rows that violate your condition.
            • Skipped entirely when 𝗱𝗶𝘀𝗮𝗯𝗹𝗲𝗧𝗲𝘀𝘁𝘀 is set.
          allowsMultiple: true
          parameters:
            - name: querySQL
              type: string
              description: SQL statement to execute as a validation test.
              isRequired: true
              example: 'SELECT 1'

            - name: continueOnFailure
              type: boolean
              description: Determines whether execution continues when the test fails.
              isRequired: false
              default: true

            - name: runOrder
              type: string
              description: Determines whether the test is executed before or after the load operation.
              isRequired: false
              default: After
              options:
                - Before
                - After

        - name: preSQL
          description: |-
            • SQL statement to execute before the data load operation — e.g. staging setup, dropping temp tables, or capturing pre-load state.
            • Repeat the annotation to run multiple statements in the order they appear.
            • Ignored on views.
          allowsMultiple: true
          parameters:
          - name: querySQL
            type: string
            description: Query to be executed.
            isRequired: true
            example: 'SELECT 1'

        - name: postSQL
          description: |-
            • SQL statement to execute after the data load operation — e.g. updating dependent tables, cleaning up temp objects, or logging load completion.
            • Repeat the annotation to run multiple statements in the order they appear.
            • Ignored on views.
          allowsMultiple: true
          parameters:
          - name: querySQL
            type: string
            description: Query to be executed.
            isRequired: true
            example: 'SELECT 1'

        column:

        - name: inHash
          description: |-
                • Marks a column as an input to a generated hash key, grouped by 𝗵𝗮𝘀𝗵𝗡𝗮𝗺𝗲 and ordered within that group by 𝗵𝗮𝘀𝗵𝗢𝗿𝗱𝗲𝗿.
                • Mark every column that should feed a given hash with the same 𝗵𝗮𝘀𝗵𝗡𝗮𝗺𝗲, then call the 𝐠𝐞𝐭_𝐡𝐚𝐬𝐡("<hashName>") macro elsewhere in the SELECT to produce the actual hash column from those marked columns.
                • Call it as {{ get_hash('<hashName>', '<algo>', '<delimiter>') }}. algo and delimiter are optional (defaults SHA1 and ||), e.g. {{ get_hash('GH_COL', 'MD5', '|') }}.
                • MD5 / SHA1 / SHA224 / SHA256 / SHA384 / SHA512 return a lowercase hex string. Other ClickHouse hash functions (e.g. cityHash64, xxHash64) are called as written; their number is stored as text, so wrap the call in toUInt64(...) for a numeric column.
                • NULL values are hashed as 'null'. 𝗦𝗲𝗲 𝗱𝗼𝗰𝘂𝗺𝗲𝗻𝘁𝗮𝘁𝗶𝗼𝗻 𝗳𝗼𝗿 𝗱𝗲𝘁𝗮𝗶𝗹𝘀.
          allowsMultiple: true
          parameters:
            - name: hashName
              isRequired: true
              type: string
              description: Group hash name shared by every column feeding the same hash.
              example: GH_COL

            - name: hashOrder
              isRequired: true
              type: number
              description: Position of this column within its hash group, lowest first.
              example: 1

        - name: isBusinessKey
          description: |-
            • Marks a column as part of the business key used to match existing rows during the merge.
            • If no column is marked and no mergeStrategy is set, there is no merge — every source row is simply inserted. An explicit changeTracking or lastModified without a business key fails the run.
            • Ignored on views.

            Agentic creation — before writing the SELECT, ask the user which column(s) should be marked @isBusinessKey, or whether they want a plain insert with none. Don't guess based on column naming (e.g. assuming a "_ID"/"_KEY" column, or the first natural-looking key) — the business key is a domain decision only the user can make, and getting it wrong silently breaks change detection for every row. A business key can be more than one column; ask whether it's composite.
          isRequired: false

        - name: lastModifiedTracking
          description: |-
            • Marks the column used to detect newer source rows for an 𝗶𝗻𝗰𝗿𝗲𝗺𝗲𝗻𝘁𝗮𝗹 𝗹𝗼𝗮𝗱.
            • 𝗗𝗮𝘁𝗮𝘁𝘆𝗽𝗲 - DATE/TIME or any incrementing NUMERIC type.
            • Can only be applied to one column.
            • Must come from the source: a source column or an expression on one — not a key or system column, and not a constant or now(). Under lastModified the deploy and the run stop otherwise.
            • Must not be NULL in the source — a pre-load check fails the run if it is, since a NULL value can never compare as newer.
            • Ignored on views.
          isRequired: false

        - name: isSystemCreateDate
          description: |-
            ⚙ This is a system column.
            • Marks this column as the timestamp a row was first created.
            • 𝗥𝗲𝗾𝘂𝗶𝗿𝗲𝗱 𝘂𝗻𝗹𝗲𝘀𝘀 mergeStrategy 𝗶𝘀 𝗮𝗹𝗹𝗖𝗼𝗹𝘂𝗺𝗻𝗠𝗮𝘁𝗰𝗵, or no column is marked isBusinessKey (these write it as computed).
            • Value written under changeTracking/lastModified: CURRENT_TIMESTAMP on first insert, then kept unchanged.
            • The expression in the SELECT is only used to derive the column's datatype — its value is ignored under changeTracking/lastModified.

            Expected expression:
            CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS "SYSTEM_CREATE_DATE" @isSystemCreateDate

            Agentic creation only — manual creation adds this column automatically.
          isRequired: false

        - name: isSystemUpdateDate
          description: |-
            ⚙ This is a system column.
            • Marks this column as the timestamp a row was last updated.
            • 𝗥𝗲𝗾𝘂𝗶𝗿𝗲𝗱 𝘂𝗻𝗹𝗲𝘀𝘀 mergeStrategy 𝗶𝘀 𝗮𝗹𝗹𝗖𝗼𝗹𝘂𝗺𝗻𝗠𝗮𝘁𝗰𝗵, or no column is marked isBusinessKey (these write it as computed) — recomputed to the current timestamp on every inserted or changed row, so every row change carries an audit trail of when it was last updated.
            • Value written under changeTracking/lastModified: CURRENT_TIMESTAMP whenever the row is inserted or changed.
            • The expression in the SELECT is only used to derive the column's datatype — its value is ignored under changeTracking/lastModified.

            Expected expression:
            CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS "SYSTEM_UPDATE_DATE" @isSystemUpdateDate
            On a ReplacingMergeTree (package engine parameter or @engine("ReplacingMergeTree")) add @notNull — it is the engine's version argument, ReplacingMergeTree(`SYSTEM_UPDATE_DATE`):
            CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS "SYSTEM_UPDATE_DATE" @isSystemUpdateDate @notNull

            Agentic creation only — manual creation adds this column automatically, with @notNull when the engine is a ReplacingMergeTree.
            When writing it, add @notNull if either:
              • the user asks for a ReplacingMergeTree, or
              • the package engine parameter is set to ReplacingMergeTree.
            Otherwise leave it out.
            Add it on a new Fact before the business key is decided — on a Fact that ends up a plain-insert MergeTree it only makes the column non-nullable.
            Ex. CAST(CURRENT_TIMESTAMP AS TIMESTAMP) AS "SYSTEM_UPDATE_DATE" @isSystemUpdateDate @notNull
          isRequired: false

        - name: not_null
          description: |-
           🚦 Column-level data quality test.
            • Fails on rows where the column is 𝗡𝗨𝗟𝗟.
            • Presence enables the test — remove the annotation to turn it off.
            • Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.

        - name: uniqueness
          description: |- 
           🚦 Column-level data quality test.
            • Fails when a value appears on more than one row.
            • Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.

        - name: empty
          description: |-
           🚦 Column-level data quality test.
            • Fails on rows where the column trims to the empty string;
            • 𝗡𝗨𝗟𝗟 values pass this test and are instead caught by not_null.
            • Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.

        - name: accepted_values
          description: |-
           🚦 Column-level data quality test.
            • Fails on rows whose value is outside the allow list.
            • Repeatable — every occurrence on the column is merged into one list. Each call takes a comma-separated list or any number of separate arguments; every argument is itself comma-splittable.
                accepted_values("0, 1, 2")
                accepted_values("0", "1", "2")
                accepted_values("0") accepted_values("1, 2")
            • Each value is pasted into the SQL verbatim, so quote it to match the column's data type
                positive number/float/decimal/bool as "<value>" or <value>
                negative number/float/decimal as "-<value>"
                string as "'<value>'"
            • Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          allowsMultiple: true
          parameters:
            - name: value
              type: string
              isRequired: true

        - name: rejected_values
          description: |-
           🚦 Column-level data quality test.
            • Fails on rows whose value is in the deny list.
            • Repeatable — every occurrence on the column is merged into one list. Each call takes a comma-separated list or any number of separate arguments; every argument is itself comma-splittable.
                rejected_values("0, 1, 2")
                rejected_values("0", "1", "2")
                rejected_values("0") rejected_values("1, 2")
            • Each value is pasted into the SQL verbatim, so quote it to match the column's data type
                positive number/float/decimal/bool as "<value>" or <value>
                negative number/float/decimal as "-<value>"
                string as "'<value>'"
            • Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          allowsMultiple: true
          parameters:
            - name: value
              type: string
              isRequired: true

        - name: min_max
          description: |-
           🚦 Column-level data quality test.
            • Fails on rows outside the inclusive range. NULL values pass.
            • Applies to numeric and temporal(date/time related) columns only.
            • Each bound is pasted into the SQL verbatim, so write it as a valid SQL value for the column's data type —
                positive number/float/decimal as "<num>" or <num>
                negative number/float/decimal as "-<num>"
                date/time as "'date/time'" or "<date/time_expression>"
            • Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          parameters:
            - name: min
              type: string
              description: Inclusive lower bound the column value must not fall below.
              isRequired: true
              example: -5
            - name: max
              type: string
              description: Inclusive upper bound the column value must not exceed.
              isRequired: true
              example: 0

        - name: min_value
          description: |-
           🚦 Column-level data quality test.
            • Fails on rows below the bound. NULL values pass.
            • Applies to numeric and temporal(date/time related) columns only.
            • Pasted into the SQL verbatim — see min_max.
            • Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          parameters:
            - name: min
              type: string
              description: Inclusive lower bound the column value must not fall below.
              isRequired: true
              example: -5

        - name: max_value
          description: |-
           🚦 Column-level data quality test.
            • Fails on rows above the bound. NULL values pass.
            • Applies to numeric and temporal(date/time related) columns only.
            • Pasted into the SQL verbatim — see min_max.
            • Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          parameters:
            - name: max
              type: string
              description: Inclusive upper bound the column value must not exceed.
              isRequired: true
              example: 0

        - name: freshness
          description: |-
           🚦 Column-level data quality test.
            • Checks that the data is fresh — fails when the column's value is older than the given interval, or when the table has no rows at all. 
            • Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
            𝗡𝗼𝘁𝗲: on a DATE column the value is truncated to midnight.
          parameters:
            - name: interval
              description: |-
                How far back from now the newest value is allowed to be, expressed in the unit given by 𝘂𝗻𝗶𝘁.
              type: number
              isRequired: true
              example: 1

            - name: unit
              type: string
              options: [SECOND, MINUTE, HOUR, DAY, WEEK, MONTH, YEAR]
              default: DAY

        - name: relative_time
          description: |-
           🚦 Column-level data quality test.
            • Compares this column against another date/time column on the same node using the given operator.
            • E.g. @relative_time("<=", "END_DATE") fails any row where this column's value is not less than or equal to END_DATE.
            • A row with either side 𝗡𝗨𝗟𝗟 is left out of the check and passes.
            • Runs 𝗔𝗳𝘁𝗲𝗿 the load and continues the run on failure.
          parameters:
            - name: operator
              type: string
              description: Comparison operator used to compare this column against the other column.
              isRequired: true
              options: ["<", "<=", ">", ">=", "=", "<>"]
              example: "="

            - name: column
              type: string
              description: Name of the other date/time column on this node to compare against.
              isRequired: true
              example: <other_column>

    sqlInitializationTemplate: |-
          {%- macro ref_raw(location_name, node_name) -%}
            {% raw %}{{ ref('{% endraw %}{{ location_name }}{% raw %}', '{% endraw %}{{ node_name }}{% raw %}') }}{% endraw %}
          {%- endmacro -%}
          {%- set ns = namespace(items=[], lines=[]) -%}
          {%- set idAnnotation = '@id("<ID>") ' -%}
          {#- @isSystemUpdateDate is a ReplacingMergeTree's version argument and must be @notNull.
              Engine: the node's @engine, else the package engine parameter (as ch_table_engine()). #}
          {%- set nsInitEngine = namespace(value='') -%}
          {%- if config is defined and config and config.engine is defined and config.engine -%}
              {%- set engineArgs = config.engine.parameters if (config.engine is mapping and config.engine.parameters is defined) else [config.engine] -%}
              {%- set nsInitEngine.value = (engineArgs[0] if engineArgs else '') | string | trim -%}
          {%- elif packageParameter is defined and packageParameter.engine is defined and packageParameter.engine -%}
              {%- set nsInitEngine.value = packageParameter.engine | string | trim -%}
          {%- endif -%}
          {%- set updateDateNotNull = ' @notNull' if 'replacingmergetree' in (nsInitEngine.value | lower) else '' -%}
          {%- for dep in sources[0].dependencies -%}
            {%- for col in dep.columns -%}
              {%- set ns.items = ns.items + [{'expr': '"' ~ col.name ~ '"', 'alias': '"' ~ col.name ~ '"', 'annotation': idAnnotation.rstrip()}] -%}
            {%- endfor -%}
          {%- endfor -%}
          {%- set ns.items = ns.items + [{'expr': 'CAST(CURRENT_TIMESTAMP AS TIMESTAMP)', 'alias': '"SYSTEM_CREATE_DATE"', 'annotation': idAnnotation ~ '@isSystemCreateDate'}] -%}
          {%- set ns.items = ns.items + [{'expr': 'CAST(CURRENT_TIMESTAMP AS TIMESTAMP)', 'alias': '"SYSTEM_UPDATE_DATE"', 'annotation': idAnnotation ~ '@isSystemUpdateDate' ~ updateDateNotNull}] -%}
          {%- set maxExprLen = ns.items | map(attribute='expr') | map('length') | max -%}
          {%- set maxAliasLen = ns.items | map(attribute='alias') | map('length') | max -%}
          {%- for item in ns.items -%}
            {%- set line = (item.expr.ljust(maxExprLen) ~ ' AS ' ~ item.alias.ljust(maxAliasLen) ~ ' ' ~ item.annotation).rstrip() -%}
            {%- set ns.lines = ns.lines + [line] -%}
          {%- endfor -%}
          SELECT
              {{ ns.lines | join(',\n    ') }}
          {% for dep in sources[0].dependencies -%}
            {%- if loop.first -%}
              FROM {{ ref_raw(dep.node.location.name, dep.node.name) }} "{{ dep.node.name }}"
            {%- else %}
              INNER JOIN {{ ref_raw(dep.node.location.name, dep.node.name) }} "{{ dep.node.name }}"
              ON "{{ sources[0].dependencies[0].node.name }}".JOIN_COLUMN = "{{ dep.node.name }}".JOIN_COLUMN
            {%- endif -%}
          {%- endfor %}
name: Fact
type: NodeType
