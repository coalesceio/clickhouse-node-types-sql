fileVersion: 2
id: sqlView
isDisabled: false
metadata:
  defaultStorageLocation: null
  error: null
  nodeMetadataSpec: |
    capitalized: SQL View
    short: V
    tagColor: '#C4C4C4'
    plural: SQL Views

    config:
      - groupName: Options
        items:
        - type: materializationSelector
          options:
            - view
          default: view
          isRequired: true

        - type: toggleButton
          attributeName: selectDistinct
          displayName: Distinct

        - type: multisourceToggle

        - type: overrideSQLToggle

        - displayName: Multi Source Strategy
          attributeName: insertStrategy
          type: dropdownSelector
          default: UNION
          options:
          - "UNION"
          - "UNION ALL"
          isRequired: true
          enableIf: "{% if node.isMultisource %} true {% else %} false {% endif %}"
name: SQL View
type: NodeType
